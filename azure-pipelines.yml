trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
  drafts: false
  autoCancel: true


# ============================================================
# PIPELINE PARAMETERS
# ============================================================

parameters:

  - name: runSecurity
    displayName: 'Run Security & Quality Scan'
    type: boolean
    default: true

  - name: runFinOps
    displayName: 'Run FinOps Cost Check'
    type: boolean
    default: true

  - name: runPlan
    displayName: 'Run Terraform Plan'
    type: boolean
    default: true

  - name: runApply
    displayName: 'Run Terraform Apply (needs Plan = true)'
    type: boolean
    default: true


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Self-hosted Windows Agent Pool
  agentPool: 'Default'
  securityAgentName: 'DESKTOP-0LHF21A'
  finopsAgentName: 'DESKTOP-0LHF21A-2'

  terraformVersion: '1.14.6'

  azureServiceConnection: 'Azure-Code-Synch-SC'

  terraformRoot: '$(Build.SourcesDirectory)\staging\master-module'
  
  # Root path for Infracost scan to cover staging modules
  infracostRoot: '$(Build.SourcesDirectory)\staging'

  # Infracost organization slug
  infracostOrg: 'deepakbit2'

  # Terraform AzureRM Backend Configuration
  backendResourceGroupName: 'rg-terraform-state'
  backendStorageAccountName: 'stgtfstate4799'
  backendContainerName: 'tfstate'
  backendStateKey: 'staging/terraform.tfstate'


stages:

# ============================================================
# SECURITY & QUALITY
# ============================================================

  - stage: Security
    displayName: 'Security & Terraform Quality'

    condition: |
      and(
        succeeded(),
        eq('${{ parameters.runSecurity }}', 'true')
      )

    jobs:

      - job: TerraformSecurity
        displayName: 'Terraform Security Scan'

        pool:
          name: ${{ variables.agentPool }}
          demands:
            - Agent.Name -equals ${{ variables.securityAgentName }}

        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: 'Terraform Security Checks'

            inputs:
              targetType: inline
              pwsh: false
              script: |

                $ErrorActionPreference = "Stop"

                function Assert-Exit($step) {
                  if ($LASTEXITCODE -ne 0) {
                    throw "$step failed with exit code $LASTEXITCODE"
                  }
                }

                $terraformVersion = "$(terraformVersion)"
                $terraformRoot = "$(terraformRoot)"

                Write-Host "=========================================="
                Write-Host "Terraform Installation"
                Write-Host "=========================================="

                $terraformZip = "$env:TEMP\terraform.zip"
                $terraformExtract = "$env:TEMP\terraform"

                $terraformUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

                Invoke-WebRequest -Uri $terraformUrl -OutFile $terraformZip

                if (Test-Path $terraformExtract) {
                  Remove-Item $terraformExtract -Recurse -Force
                }

                Expand-Archive -Path $terraformZip -DestinationPath $terraformExtract -Force

                $terraformExe = "$terraformExtract\terraform.exe"

                & $terraformExe version
                Assert-Exit "terraform version"


                # ---------------- FMT ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Format Check"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" fmt -check -recursive -diff
                Assert-Exit "terraform fmt"


                # ---------------- INIT ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Init - Backend Disabled"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" init -input=false -backend=false
                Assert-Exit "terraform init"


                # ---------------- VALIDATE ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Validate"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" validate -no-color
                Assert-Exit "terraform validate"


                # ---------------- TFLINT ----------------
                Write-Host "=========================================="
                Write-Host "Installing TFLint"
                Write-Host "=========================================="

                $tflintVersion = "0.59.1"

                $tflintZip = "$env:TEMP\tflint.zip"
                $tflintExtract = "$env:TEMP\tflint"

                $tflintUrl = "https://github.com/terraform-linters/tflint/releases/download/v$tflintVersion/tflint_windows_amd64.zip"

                Invoke-WebRequest -Uri $tflintUrl -OutFile $tflintZip

                if (Test-Path $tflintExtract) {
                  Remove-Item $tflintExtract -Recurse -Force
                }

                Expand-Archive -Path $tflintZip -DestinationPath $tflintExtract -Force

                $tflintExe = "$tflintExtract\tflint.exe"

                & $tflintExe --version
                Assert-Exit "tflint version"

                Push-Location $terraformRoot

                Write-Host "TFLint Init"
                & $tflintExe --init
                Assert-Exit "tflint init"

                Write-Host "TFLint Scan"
                & $tflintExe --format compact
                Assert-Exit "tflint scan"

                Pop-Location


                # ---------------- CHECKOV ----------------
                Write-Host "=========================================="
                Write-Host "Installing Checkov"
                Write-Host "=========================================="

                python -m pip install --upgrade pip
                Assert-Exit "pip upgrade"

                python -m pip install checkov
                Assert-Exit "checkov install"

                Write-Host "Checkov Scan"
                python -m checkov.main -d "$terraformRoot" --framework terraform --quiet --compact --config-file "$terraformRoot\.checkov.yaml"
                Assert-Exit "checkov scan"


                # ---------------- TRIVY ----------------
                Write-Host "=========================================="
                Write-Host "Installing Trivy"
                Write-Host "=========================================="

                $trivyVersion = "0.75.0"

                $trivyZip = "$env:TEMP\trivy.zip"
                $trivyExtract = "$env:TEMP\trivy"

                $trivyDownloaded = $false
                foreach ($osName in @("windows-64bit", "Windows-64bit")) {
                  $trivyUrl = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_${trivyVersion}_$osName.zip"
                  try {
                    Invoke-WebRequest -Uri $trivyUrl -OutFile $trivyZip
                    $trivyDownloaded = $true
                    break
                  } catch {
                    Write-Host "Download failed: $trivyUrl"
                  }
                }

                if (-not $trivyDownloaded) {
                  throw "Trivy download failed for version $trivyVersion"
                }

                if (Test-Path $trivyExtract) {
                  Remove-Item $trivyExtract -Recurse -Force
                }

                New-Item -ItemType Directory -Path $trivyExtract -Force | Out-Null

                Expand-Archive -Path $trivyZip -DestinationPath $trivyExtract -Force

                $trivyExe = "$trivyExtract\trivy.exe"

                & $trivyExe --version
                Assert-Exit "trivy version"

                Write-Host "Trivy IaC Scan"
                & $trivyExe config "$terraformRoot" --severity HIGH,CRITICAL --exit-code 1
                Assert-Exit "trivy scan"

# ============================================================
# FINOPS COST CHECK
# ============================================================

  - stage: FinOps
    displayName: 'FinOps Cost Scan'
    dependsOn: [] # Runs in parallel with Security stage without waiting

    condition: |
      and(
        succeeded(),
        eq('${{ parameters.runFinOps }}', 'true')
      )

    jobs:

      - job: InfracostScan
        displayName: 'Infracost Budget & Cost Scan'

        pool:
          name: ${{ variables.agentPool }}
          demands:
            - Agent.Name -equals ${{ variables.finopsAgentName }}

        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: 'Run Infracost Breakdown Scan'
            continueOnError: true
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)

            inputs:
              targetType: inline
              pwsh: false
              script: |
                Write-Host "=========================================="
                Write-Host "Running Infracost Cost Breakdown"
                Write-Host "=========================================="

                $targetPath = "$(terraformRoot)"
                if (-not (Test-Path $targetPath)) {
                  $targetPath = "$(infracostRoot)"
                }

                Write-Host "Target Directory: $targetPath"

                # Infracost breakdown scan (v0.10.x compatible)
                infracost breakdown --path "$targetPath" --format table

                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Infracost scan encountered diagnostics warning (exit code $LASTEXITCODE)."
                }

# ============================================================
# TERRAFORM PLAN
# ============================================================

  - stage: Plan
    displayName: 'Terraform Plan'

    dependsOn:
      - Security
      - FinOps

    condition: |
      and(
        not(failed()),
        not(canceled()),
        eq('${{ parameters.runPlan }}', 'true')
      )

    jobs:

      - job: TerraformPlan
        displayName: 'Create Terraform Plan'

        pool:
          name: ${{ variables.agentPool }}

        steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Terraform Init and Plan'

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: ps
              scriptLocation: inlineScript
              addSpnToEnvironment: true

              inlineScript: |

                $ErrorActionPreference = "Stop"

                function Assert-Exit($step) {
                  if ($LASTEXITCODE -ne 0) {
                    throw "$step failed with exit code $LASTEXITCODE"
                  }
                }

                $terraformVersion = "$(terraformVersion)"
                $terraformRoot = "$(terraformRoot)"

                Write-Host "=========================================="
                Write-Host "Azure OIDC Authentication"
                Write-Host "=========================================="

                if (-not $env:servicePrincipalId) { throw "Service connection client ID missing" }
                if (-not $env:tenantId)           { throw "Tenant ID missing" }
                if (-not $env:idToken)            { throw "OIDC token missing" }

                $env:ARM_USE_OIDC = "true"
                $env:ARM_USE_AZUREAD = "true"
                $env:ARM_CLIENT_ID = $env:servicePrincipalId
                $env:ARM_TENANT_ID = $env:tenantId

                $subscriptionId = az account show --query id --output tsv
                Assert-Exit "az account show"

                $env:ARM_SUBSCRIPTION_ID = $subscriptionId
                $env:ARM_OIDC_TOKEN = $env:idToken


                # ---------------- TERRAFORM INSTALL ----------------
                Write-Host "=========================================="
                Write-Host "Installing Terraform"
                Write-Host "=========================================="

                $terraformZip = "$env:TEMP\terraform.zip"
                $terraformExtract = "$env:TEMP\terraform"

                $terraformUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

                Invoke-WebRequest -Uri $terraformUrl -OutFile $terraformZip

                if (Test-Path $terraformExtract) {
                  Remove-Item $terraformExtract -Recurse -Force
                }

                Expand-Archive -Path $terraformZip -DestinationPath $terraformExtract -Force

                $terraformExe = "$terraformExtract\terraform.exe"

                & $terraformExe version
                Assert-Exit "terraform version"


                # ---------------- INIT ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Init"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" init -input=false -reconfigure `
                  -backend-config="resource_group_name=$(backendResourceGroupName)" `
                  -backend-config="storage_account_name=$(backendStorageAccountName)" `
                  -backend-config="container_name=$(backendContainerName)" `
                  -backend-config="key=$(backendStateKey)"
                Assert-Exit "terraform init"


                # ---------------- VALIDATE ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Validate"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" validate -no-color
                Assert-Exit "terraform validate"


                # ---------------- PLAN ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Plan"
                Write-Host "=========================================="

                $planBinaryDirectory = "$(Build.ArtifactStagingDirectory)\plan-binary"
                $planReadableDirectory = "$(Build.ArtifactStagingDirectory)\plan-readable"

                New-Item -ItemType Directory -Path $planBinaryDirectory -Force | Out-Null
                New-Item -ItemType Directory -Path $planReadableDirectory -Force | Out-Null

                $planPath = "$planBinaryDirectory\tfplan"

                & $terraformExe -chdir="$terraformRoot" plan -input=false -no-color -out="$planPath"
                Assert-Exit "terraform plan"


                # ---------------- HUMAN READABLE PLAN EXPORT ----------------
                Write-Host "=========================================="
                Write-Host "Generating Human-Readable Plan Files"
                Write-Host "=========================================="

                # 1. Plain Text Format (Easily readable in Notepad, VS Code, Browser)
                $planText = & $terraformExe -chdir="$terraformRoot" show -no-color "$planPath"
                $planText | Out-File -FilePath "$planReadableDirectory\tfplan.txt" -Encoding utf8
                Write-Host ($planText -join "`n")

                # 2. JSON Format (For audit and programmatic review)
                & $terraformExe -chdir="$terraformRoot" show -json "$planPath" | Out-File -FilePath "$planReadableDirectory\tfplan.json" -Encoding utf8
                Assert-Exit "terraform show"


          # 1. Binary Artifact (For Terraform Apply engine)
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan (Binary)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)\plan-binary'
              artifact: 'terraform-plan-binary'

          # 2. Human-Readable Artifact (For Human Review: tfplan.txt & tfplan.json)
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan (Human Readable)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)\plan-readable'
              artifact: 'terraform-plan-readable'


# ============================================================
# MANUAL APPROVAL
# ============================================================

  - stage: Approval
    displayName: 'Manual Approval'

    dependsOn:
      - Plan

    condition: |
      and(
        not(failed()),
        not(canceled()),
        eq('${{ parameters.runPlan }}', 'true'),
        eq('${{ parameters.runApply }}', 'true'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/feature')
        )
      )

    jobs:

      - job: WaitForApproval
        displayName: 'Approve Terraform Apply'
        pool: server
        timeoutInMinutes: 1440 # Pauses up to 24 hours without consuming any build agent

        steps:

          - task: ManualValidation@0
            displayName: 'Review Plan and Approve Apply'
            timeoutInMinutes: 1440
            inputs:
              instructions: 'Please review the Terraform Plan and FinOps cost estimate before resuming to Terraform Apply.'
              onTimeout: 'reject'


# ============================================================
# TERRAFORM APPLY
# ============================================================

  - stage: Apply
    displayName: 'Terraform Apply'

    dependsOn:
      - Plan
      - Approval

    condition: |
      and(
        not(failed()),
        not(canceled()),
        eq('${{ parameters.runPlan }}', 'true'),
        eq('${{ parameters.runApply }}', 'true'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/feature')
        )
      )

    jobs:

      - deployment: TerraformApply
        displayName: 'Apply Terraform'

        environment: 'terraform-pre-production'

        pool:
          name: ${{ variables.agentPool }}

        strategy:

          runOnce:

            deploy:

              steps:

                - checkout: self

                # Download reviewed binary plan artifact from Plan stage
                - download: current
                  artifact: terraform-plan-binary

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'

                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: ps
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true

                    inlineScript: |

                      $ErrorActionPreference = "Stop"

                      function Assert-Exit($step) {
                        if ($LASTEXITCODE -ne 0) {
                          throw "$step failed with exit code $LASTEXITCODE"
                        }
                      }

                      $terraformVersion = "$(terraformVersion)"
                      $terraformRoot = "$(terraformRoot)"

                      Write-Host "=========================================="
                      Write-Host "Azure OIDC Authentication"
                      Write-Host "=========================================="

                      if (-not $env:servicePrincipalId) { throw "Service connection client ID missing" }
                      if (-not $env:tenantId)           { throw "Tenant ID missing" }
                      if (-not $env:idToken)            { throw "OIDC token missing" }

                      $env:ARM_USE_OIDC = "true"
                      $env:ARM_USE_AZUREAD = "true"
                      $env:ARM_CLIENT_ID = $env:servicePrincipalId
                      $env:ARM_TENANT_ID = $env:tenantId

                      $subscriptionId = az account show --query id --output tsv
                      Assert-Exit "az account show"

                      $env:ARM_SUBSCRIPTION_ID = $subscriptionId
                      $env:ARM_OIDC_TOKEN = $env:idToken


                      # ---------------- TERRAFORM INSTALL ----------------
                      Write-Host "=========================================="
                      Write-Host "Installing Terraform"
                      Write-Host "=========================================="

                      $terraformZip = "$env:TEMP\terraform.zip"
                      $terraformExtract = "$env:TEMP\terraform"

                      $terraformUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

                      Invoke-WebRequest -Uri $terraformUrl -OutFile $terraformZip

                      if (Test-Path $terraformExtract) {
                        Remove-Item $terraformExtract -Recurse -Force
                      }

                      Expand-Archive -Path $terraformZip -DestinationPath $terraformExtract -Force

                      $terraformExe = "$terraformExtract\terraform.exe"

                      & $terraformExe version
                      Assert-Exit "terraform version"


                      # ---------------- INIT ----------------
                      Write-Host "=========================================="
                      Write-Host "Terraform Init"
                      Write-Host "=========================================="

                      & $terraformExe -chdir="$terraformRoot" init -input=false -reconfigure `
                        -backend-config="resource_group_name=$(backendResourceGroupName)" `
                        -backend-config="storage_account_name=$(backendStorageAccountName)" `
                        -backend-config="container_name=$(backendContainerName)" `
                        -backend-config="key=$(backendStateKey)"
                      Assert-Exit "terraform init"


                      # ---------------- APPLY (reviewed plan) ----------------
                      Write-Host "=========================================="
                      Write-Host "Terraform Apply"
                      Write-Host "=========================================="

                      $applyPlan = "$(Pipeline.Workspace)\terraform-plan-binary\tfplan"

                      if (-not (Test-Path $applyPlan)) {
                        throw "Plan file not found at $applyPlan"
                      }

                      & $terraformExe -chdir="$terraformRoot" apply -input=false -auto-approve "$applyPlan"
                      Assert-Exit "terraform apply"