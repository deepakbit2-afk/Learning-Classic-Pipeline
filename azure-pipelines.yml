trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
  drafts: false
  autoCancel: true


# ============================================================
# PIPELINE PARAMETERS
# ============================================================

parameters:

  - name: runSecurity
    displayName: 'Run Security & Quality Scan'
    type: boolean
    default: true

  - name: runFinOps
    displayName: 'Run FinOps Cost Check'
    type: boolean
    default: true

  - name: runPlan
    displayName: 'Run Terraform Plan'
    type: boolean
    default: true

  - name: runApply
    displayName: 'Run Terraform Apply (needs Plan = true)'
    type: boolean
    default: true


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Self-hosted Windows Agent Pool
  agentPool: 'Default'

  terraformVersion: '1.14.6'

  azureServiceConnection: 'Azure-Code-Synch-SC'

  terraformRoot: '$(Build.SourcesDirectory)\staging\master-module'
  
  # Infracost के लिए पूरा रूट पाथ ताकि master और slave दोनों मॉड्यूल्स शामिल हो सकें
  infracostRoot: '$(Build.SourcesDirectory)\staging'

  # Infracost organization slug
  infracostOrg: 'deepakbit2'


stages:

# ============================================================
# SECURITY & QUALITY
# ============================================================

  - stage: Security
    displayName: 'Security & Terraform Quality'

    condition: |
      and(
        succeeded(),
        eq('${{ parameters.runSecurity }}', 'true')
      )

    jobs:

      - job: TerraformSecurity
        displayName: 'Terraform Security Scan'

        pool:
          name: ${{ variables.agentPool }}

        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: 'Terraform Security Checks'

            inputs:
              targetType: inline
              pwsh: false
              script: |

                $ErrorActionPreference = "Stop"

                function Assert-Exit($step) {
                  if ($LASTEXITCODE -ne 0) {
                    throw "$step failed with exit code $LASTEXITCODE"
                  }
                }

                $terraformVersion = "$(terraformVersion)"
                $terraformRoot = "$(terraformRoot)"

                Write-Host "=========================================="
                Write-Host "Terraform Installation"
                Write-Host "=========================================="

                $terraformZip = "$env:TEMP\terraform.zip"
                $terraformExtract = "$env:TEMP\terraform"

                $terraformUrl = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

                Invoke-WebRequest -Uri $terraformUrl -OutFile $terraformZip

                if (Test-Path $terraformExtract) {
                  Remove-Item $terraformExtract -Recurse -Force
                }

                Expand-Archive -Path $terraformZip -DestinationPath $terraformExtract -Force

                $terraformExe = "$terraformExtract\terraform.exe"

                & $terraformExe version
                Assert-Exit "terraform version"


                # ---------------- FMT ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Format Check"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" fmt -check -recursive -diff
                Assert-Exit "terraform fmt"


                # ---------------- INIT ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Init - Backend Disabled"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" init -input=false -backend=false
                Assert-Exit "terraform init"


                # ---------------- VALIDATE ----------------
                Write-Host "=========================================="
                Write-Host "Terraform Validate"
                Write-Host "=========================================="

                & $terraformExe -chdir="$terraformRoot" validate -no-color
                Assert-Exit "terraform validate"


                # ---------------- TFLINT ----------------
                Write-Host "=========================================="
                Write-Host "Installing TFLint"
                Write-Host "=========================================="

                $tflintVersion = "0.59.1"

                $tflintZip = "$env:TEMP\tflint.zip"
                $tflintExtract = "$env:TEMP\tflint"

                $tflintUrl = "https://github.com/terraform-linters/tflint/releases/download/v$tflintVersion/tflint_windows_amd64.zip"

                Invoke-WebRequest -Uri $tflintUrl -OutFile $tflintZip

                if (Test-Path $tflintExtract) {
                  Remove-Item $tflintExtract -Recurse -Force
                }

                Expand-Archive -Path $tflintZip -DestinationPath $tflintExtract -Force

                $tflintExe = "$tflintExtract\tflint.exe"

                & $tflintExe --version
                Assert-Exit "tflint version"

                Push-Location $terraformRoot

                Write-Host "TFLint Init"
                & $tflintExe --init
                Assert-Exit "tflint init"

                Write-Host "TFLint Scan"
                & $tflintExe --format compact
                Assert-Exit "tflint scan"

                Pop-Location


                # ---------------- CHECKOV ----------------
                Write-Host "=========================================="
                Write-Host "Installing Checkov"
                Write-Host "=========================================="

                python -m pip install --upgrade pip
                Assert-Exit "pip upgrade"

                python -m pip install checkov
                Assert-Exit "checkov install"

                Write-Host "Checkov Scan"
                python -m checkov.main -d "$terraformRoot" --framework terraform --quiet --compact --config-file "$terraformRoot\.checkov.yaml"
                Assert-Exit "checkov scan"


                # ---------------- TRIVY ----------------
                Write-Host "=========================================="
                Write-Host "Installing Trivy"
                Write-Host "=========================================="

                $trivyVersion = "0.75.0"

                $trivyZip = "$env:TEMP\trivy.zip"
                $trivyExtract = "$env:TEMP\trivy"

                $trivyDownloaded = $false
                foreach ($osName in @("windows-64bit", "Windows-64bit")) {
                  $trivyUrl = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_${trivyVersion}_$osName.zip"
                  try {
                    Invoke-WebRequest -Uri $trivyUrl -OutFile $trivyZip
                    $trivyDownloaded = $true
                    break
                  } catch {
                    Write-Host "Download failed: $trivyUrl"
                  }
                }

                if (-not $trivyDownloaded) {
                  throw "Trivy download failed for version $trivyVersion"
                }

                if (Test-Path $trivyExtract) {
                  Remove-Item $trivyExtract -Recurse -Force
                }

                New-Item -ItemType Directory -Path $trivyExtract -Force | Out-Null

                Expand-Archive -Path $trivyZip -DestinationPath $trivyExtract -Force

                $trivyExe = "$trivyExtract\trivy.exe"

                & $trivyExe --version
                Assert-Exit "trivy version"

                Write-Host "Trivy IaC Scan"
                & $trivyExe config "$terraformRoot" --severity HIGH,CRITICAL --exit-code 1
                Assert-Exit "trivy scan"

# ============================================================
# FINOPS COST CHECK
# ============================================================

  - stage: FinOps
    displayName: 'FinOps Cost Scan'
    dependsOn: [] # Security स्टेज का इंतज़ार किए बिना पैरेलल में चलेगा

    condition: |
      and(
        succeeded(),
        eq('${{ parameters.runFinOps }}', 'true')
      )

    jobs:

      - job: InfracostScan
        displayName: 'Infracost Budget & Cost Scan'

        pool:
          name: ${{ variables.agentPool }}

        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: 'Run Infracost Breakdown Scan'
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)

            inputs:
              targetType: inline
              pwsh: false
              script: |
                $ErrorActionPreference = "Stop"

                # रेपो रूट की पहचान
                infracost config set repo_path "$(Build.SourcesDirectory)"
                
                Write-Host "Running Infracost Scan on staging root folder..."
                infracost breakdown --path "$(infracostRoot)" --format table --org "$(infracostOrg)"
                
                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Infracost scan encountered diagnostics warning."
                }

# ============================================================
# TERRAFORM PLAN STAGE (वैकल्पिक प्लेसहोल्डर)
# ============================================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: [Security, FinOps]
    condition: and(succeeded(), eq('${{ parameters.runPlan }}', 'true'))
    jobs:
      - job: Plan
        pool:
          name: ${{ variables.agentPool }}
        steps:
          - script: echo "Terraform Plan Logic Goes Here"
